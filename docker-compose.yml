services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asf
      POSTGRES_PASSWORD: asf
      POSTGRES_DB: asf
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asf']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
