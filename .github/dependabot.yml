version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/registry, /apps/worker]
    schedule: { interval: weekly }
    # Node majors are chosen by hand to land on an LTS line (odd majors like 25
    # are short-lived and already end-of-life); minor/patch base-image refreshes
    # still come through.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
